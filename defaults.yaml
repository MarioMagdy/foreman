# foreman run sheet — copy, fill in for the job, show the owner, WAIT for a yes.
# Every value here is a default to be overridden, not a decision already made.

plan: <path to the agreed plan>
repos: [<repo or worktree pair>]

# ---- REQUIRED: filled by the architect pass. A run sheet with any of these blank is not ready. ----
architecture:
  critical_path: [<stage>, <stage>, ...]       # longest chain of `needs`
  tracks:                                       # chains that progress without waiting on each other
    - { id: <A>, stages: [<stage>, ...], files: [<paths this track owns>] }
  joins:                                        # stages needing two tracks; own stage, own tests
    - { stage: <id>, needs_tracks: [<A>, <B>], owner: <manager id> }   # single mode: the orchestrator
  width: <n>                                    # most stages that could run at once
  effective_parallelism: <n>                    # min(width, worker slots, heavy cap, quotas, live managers) + why
staffing: <single | tracks>                     # tracks -> one manager per track (SKILL.md "Track mode"); say why
profile: _runs/<run>/_coord/profile.yaml        # copied from profiles/default.yaml; fallback chains pre-approved
events: _runs/<run>/_coord/events/              # one JSONL file per actor, one line per hand-off
plan_data: _runs/<run>/_coord/plan.yaml         # milestones + stages (needs, builder, track) for the live view
restart:
  check_in: every <30-60> min (CronCreate, created at start, deleted at the end)
  rebuild_from: _runs/<run>/_coord/             # tracks/<id>.md + events + staffing.yaml
standing_orders:                                # decisions made up front, with defaults and a named decider
  - { question: <...>, default: <...>, decider: <owner | orchestrator | manager> }

arrangement: milestones+stages     # milestones | milestones+stages | milestones+stages+steps
                                   # small job -> milestones only
                                   # steps only when one stage exceeds a worker's sitting

branching:
  base: main                       # ask once if the repo has a dev branch, else main
  milestone_branches: stacked      # each milestone branches off the previous
  stage_branches: stacked          # each stage branches off the previous, PR into the milestone
  stage_prs: real                  # real GitHub PRs, so judge findings stay readable after merge
  merge_policy:
    stages: foreman-after-gate     # a gated stage merges into its milestone branch, no need to ask
    milestones: owner-explicit-only  # the owner reviews the milestone PR, then merges it (or says to)
                                   # nothing reaches the base branch on the foreman's judgment

settings:                          # run settings; the `delegation` skill applies them to every worker. Copy this block
                                   # into _coord/plan.yaml `settings:` so the dashboard header shows it.
  stage_gate: full-suite           # full-suite (worker runs the whole suite, fixes its own failures) | targeted | none
  full_suite_slots: 1              # workers that may run a full suite at once on one machine (lock in _coord/locks/)
  review: per-stage                # per-stage | per-milestone | none; who reviews is in `reviewers:`
  human_review: per-milestone      # per-milestone | per-stage | end-only
  milestones: working-slices       # each milestone usable end to end (data + backend + screen); not by layer
  milestone_gates: ai-then-human   # each planned milestone ends: AI gate, then the owner's gate (references/gates.md)
  verification: suite-output + targeted   # what the foreman re-runs per stage; full suite once per milestone
                                   # integration, on the FIRST merge, not the last
  expected_minutes: {}             # per job, from your own past runs per model and task type; 1.5x = flag at the
                                   # check-in and a post-mortem question, NOT a kill
  hard_stop: 15                    # minutes with no growth in _scratch/PROGRESS.md or ACTIVITY.log; or 3x expected
  mailbox_interval_min: 2          # 1-5; agy's idle heartbeat (each one is a model call)
  usage_stop: { dispatch: baseline+15, all: baseline+25 }   # weekly usage points; detached watchdog from the start

gates:                             # who checks a unit before it is called ready
  trivial: self-review             # foreman reads the diff and runs the tests
  small:   self-review
  medium:  self-review + tester    # tester EXECUTES the project's test skill
  large:   council                 # council-judge, max effort, findings as PR comments first
  overrides: []                    # e.g. ["council on every stage"] when the owner says so

workers:                           # GENERIC. The owner's own routing is filled in per job, from his
                                   # words first, then LOCAL.md (if present), then what is installed.
                                   # Version-suffix every name and CHECK IT LIVE; owner-named workers
                                   # win verbatim.
  ui_work:   <model>               # UI / frontend, given a mechanics-level brief
  spec_work: <model>               # fully specified work, no judgment needed
  bulk_dumb: <model>               # repetitive, high-volume edits
  thinking:  <model>               # hard design, contracts, tricky fixes
  advisor:   <model>               # deepest available thinker; ask BEFORE committing to an approach
  judging:   <model>               # deep reviewer for gates; council-judge panel for `large`
  claude_ok: true                  # false when Claude quota is short -> other harnesses only
  route_by_shape:                  # 2026-10-16 post-mortem; adjust per job
    read_only_audit: <fast reader, e.g. a Gemini Flash via agy>
    fix_with_rulings: <fast fixer, e.g. DeepSeek via opencode>   # also continuations and wording
    greenfield_feature: <builder>, with the tail to the fast fixer; backend and front end are separate jobs
    money_or_security: always a deep review with measured evidence
  prohibited: []
  # Where a row lists alternatives (`a | b`), pick per availability and per task, and SAY which
  # you picked and why. Never silently drop a tier. If the judge errors, fall back to the next
  # strongest and say so; never silently downgrade judging to a small model.

reviewers:                         # who reviews what; may change mid-run (edit here, say so, log it)
  contract_stages: <model>         # before dependents start
  milestone_end:   <model>
  findings: pr-comment-before-fix  # review findings go on the PR as a comment before any fix commit

heavy_lifting: <name the worker carrying the bulk, explicitly>
max_concurrent_heavy: 2            # Windows: 0xC0000142 above this

artifacts: _runs/<YYYY-MM-DD>-M<n>/{briefs,reports,evidence}   # one run folder per milestone, never committed
notify: on-milestone-ready
owner_updates: every 1h            # from the profile; show it here so the owner confirms or changes it

dashboard:                         # optional; only when the owner asks for a tracker
  url: <claude.ai artifact url>    # published from dashboard/tracker.html, see dashboard/SCHEMA.md
  update: every-stage-transition + every-iteration   # status/meta on transitions; one log entry (with ref) per build/review/fix round
  added_items: origin-added        # anything created after planning carries origin:"added" + addedReason

environment:                       # fill in BEFORE building; these are the ones that bite
  local_db_resolves_to: <verify it, do not assume>
  writes_reach_production: <yes/no — if yes, fix it first>
  paid_calls: <which actions cost money, and how much per unit>
  forbidden_paths: []              # trees no agent may touch
  toolchain: <pinned Python (.python-version), node version; checked before the first build>
  deployment_shape: <workers, replicas, proxies>   # a fact from the architect pass; read it before believing an audit's severity
  worktrees: delegation/prepare_worktree.py per job (venv, deps, test data, hooks, quick test)
