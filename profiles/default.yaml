# Default profile: approved once by the owner, copied into each run as _coord/profile.yaml.
# Fallbacks listed here are PRE-APPROVED: a dead, hung or rate-limited worker is replaced along its
# chain without asking the owner again. Fallbacks are for failures, never to skip a queue.
# Re-check every model name live before a run (`opencode models`, your harness's model list).
# EXAMPLE: every <...> is yours to fill (or put your routing in LOCAL.md). Names are version-suffixed, except where
# the harness only takes aliases (Claude Code subagents: sonnet, opus, haiku).

orchestrator: { model: <your strongest session model>, note: "the owner's session" }
advisor:      { model: <deepest thinker available> }
manager:      { model: <strong model>, effort: medium, fallback: [ { model: <same model>, effort: high } ] }

builders:                  # one entry per builder you route to; the key is what plan.yaml `builder:` names
  fast:     { model: "<cheap fast builder, e.g. an opencode model>", fallback: [ <second builder>, <session model> ] }
  careful:  { model: <stronger builder>,                         fallback: [ <session model> ] }
reviewer:   { model: <reviewer that did not build the stage>,    fallback: [ <session model> ] }

workers:
  opencode_slots: 3        # through the launcher's single `opencode serve`; tested up to 5
  heavy_agents_max: 2      # non-opencode heavy local agents at once (Windows)

managers:
  live_max: 4
  depth_max: 3             # orchestrator, manager, sub-manager

owner_updates:
  every: 1h                # plus at once: milestone ready, a decision outside standing orders, a plan change
  live_view: on stage change and on manager update

budget:
  manager_spend_cap_per_run: null   # set per run; warn the owner at 80%, stop starting managers at 100%
